<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Dynamic Task Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="container">
        <section class="task-manager">
            <h1>Secure Dynamic Task Manager</h1>

            <div class="task-form">
                <label for="taskInput" class="sr-only">
                    Enter a task
                </label>

                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter a task"
                    autocomplete="off"
                >

                <button type="button" id="addTaskBtn">
                    Add Task
                </button>

                <button type="button" id="loadSamplesBtn">
                    Load Sample Tasks
                </button>
            </div>

            <p
                id="taskMessage"
                class="task-message"
                aria-live="polite"
            ></p>

            <div class="summary">
                <div class="summary-card">
                    <span class="summary-label">Total Tasks</span>
                    <span id="totalCount" class="summary-count">0</span>
                </div>

                <div class="summary-card">
                    <span class="summary-label">Pending</span>
                    <span id="pendingCount" class="summary-count">0</span>
                </div>

                <div class="summary-card">
                    <span class="summary-label">Completed</span>
                    <span id="completedCount" class="summary-count">0</span>
                </div>
            </div>

            <ul id="taskList" class="task-list"></ul>
        </section>
    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
